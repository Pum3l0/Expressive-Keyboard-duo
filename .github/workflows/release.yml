name: Release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup

      - name: Build Release and Debug APK
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v11.1.2-duo.{0}', github.run_number) }}
          name: Expressive Keyboard Duo ${{ github.ref_type == 'tag' && github.ref_name || format('v11.1.2-duo.{0}', github.run_number) }}
          body: |
            Expressive Keyboard Duo release build.
            - Release APK: optimized production build.
            - Debug APK: debug build (installs side-by-side as a separate app).
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
